name: Production image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Resolve immutable tag
        id: meta
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPO,,}:production-$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
      - name: Record pushed image identity
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 .github/release-tools/production_identity.py write
      - name: Preserve immutable image identity
        uses: actions/upload-artifact@v4
        with:
          name: production-image-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: production-image-identity.json
          if-no-files-found: error
          retention-days: 30
